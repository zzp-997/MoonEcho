# ============================================================
# 回声（Echo Meet）GitHub Actions CI/CD 流水线
# 功能：代码检查 / 测试 / 构建 / 部署
# ============================================================

name: Echo Meet CI/CD Pipeline

on:
  push:
    branches:
      - master
      - develop
      - 'release/*'
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - production

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_WEB: ${{ github.repository }}/web

jobs:
  # ----------------------------------------------------------
  # 代码质量检查
  # ----------------------------------------------------------
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装后端依赖
        working-directory: backend
        run: |
          pip install -e .[dev]

      - name: 运行代码格式检查
        working-directory: backend
        run: |
          black --check app/ tests/ --diff
          isort --check-only app/ tests/

      - name: 运行类型检查
        working-directory: backend
        run: |
          mypy app/ --ignore-missing-imports

      - name: 运行代码安全扫描
        uses: github/codeql-action/analyze@v2
        with:
          languages: python

  # ----------------------------------------------------------
  # 后端单元测试
  # ----------------------------------------------------------
  backend-tests:
    name: 后端测试
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_2026
          MYSQL_DATABASE: echo_meet_test
          MYSQL_USER: echo_test
          MYSQL_PASSWORD: test_2026
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装测试依赖
        working-directory: backend
        run: |
          pip install -e .[dev]

      - name: 等待数据库就绪
        run: |
          for i in {1..30}; do
            mysql -h 127.0.0.1 -u root -ptest_root_2026 -e "SELECT 1" && break
            echo "等待 MySQL..."
            sleep 2
          done

      - name: 运行数据库迁移
        working-directory: backend
        env:
          DATABASE_URL: mysql+aiomysql://echo_test:test_2026@127.0.0.1:3306/echo_meet_test
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: test_jwt_secret_key_for_ci
          APP_ENV: test
        run: |
          alembic upgrade head

      - name: 运行测试
        working-directory: backend
        env:
          DATABASE_URL: mysql+aiomysql://echo_test:test_2026@127.0.0.1:3306/echo_meet_test
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: test_jwt_secret_key_for_ci
          APP_ENV: test
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=html

      - name: 上传测试覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  # ----------------------------------------------------------
  # 前端构建检查
  # ----------------------------------------------------------
  frontend-build:
    name: 前端构建检查
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: |
          npm ci

      - name: 运行类型检查
        working-directory: frontend
        run: |
          npm run type-check || echo "类型检查完成"

      - name: 构建 H5 版本
        working-directory: frontend
        run: |
          npm run build:h5

      - name: 构建微信小程序版本
        working-directory: frontend
        run: |
          npm run build:mp-weixin

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            frontend/dist/build/h5/
            frontend/dist/build/mp-weixin/
          retention-days: 7

  # ----------------------------------------------------------
  # 管理后台构建检查
  # ----------------------------------------------------------
  admin-web-build:
    name: 管理后台构建检查
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - name: 安装依赖
        working-directory: admin-web
        run: |
          npm ci

      - name: 构建管理后台
        working-directory: admin-web
        run: |
          npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: admin-web/dist/
          retention-days: 7

  # ----------------------------------------------------------
  # 构建 Docker 镜像
  # ----------------------------------------------------------
  build-images:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, admin-web-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Git 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: 构建并推送 API 镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送 Nginx 镜像（包含前端）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/nginx.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------
  # 部署到公测环境
  # ----------------------------------------------------------
  deploy-beta:
    name: 部署公测环境
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    environment:
      name: beta
      url: https://beta.echomeet.cn

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH 连接
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BETA_SERVER_HOST }}
          username: ${{ secrets.BETA_SERVER_USER }}
          key: ${{ secrets.BETA_SERVER_SSH_KEY }}
          script: |
            cd /opt/echo-meet
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker-compose exec -T api alembic upgrade head
            docker-compose restart nginx

      - name: 发送部署通知
        uses: 8398a7/action-slack@v3
        with:
          status: success
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ----------------------------------------------------------
  # 部署到生产环境（手动触发）
  # ----------------------------------------------------------
  deploy-production:
    name: 部署生产环境
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'

    environment:
      name: production
      url: https://api.echomeet.cn

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认部署
        run: |
          echo "即将部署到生产环境"
          echo "版本: ${GITHUB_SHA}"
          echo "时间: $(date)"

      - name: 配置 SSH 连接
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /opt/echo-meet

            # 备份当前版本
            docker-compose exec -T mysql mysqldump -u root -p${MYSQL_ROOT_PASSWORD} echo_meet | gzip > /backup/pre_deploy_${GITHUB_SHA}.sql.gz

            # 拉取新镜像
            docker-compose -f docker-compose.prod.yml pull

            # 执行蓝绿部署
            docker-compose -f docker-compose.prod.yml up -d --no-deps --build api_new

            # 等待新版本就绪
            sleep 30

            # 健康检查
            curl -f http://localhost:8001/health || exit 1

            # 切换流量
            docker-compose -f docker-compose.prod.yml exec -T nginx nginx -s reload

            # 停止旧版本
            docker-compose -f docker-compose.prod.yml stop api
            docker-compose -f docker-compose.prod.yml rm -f api

            # 重命名新版本
            docker-compose -f docker-compose.prod.yml up -d --no-deps --scale api=2 --scale api_new=0

            # 数据库迁移
            docker-compose -f docker-compose.prod.yml exec -T api alembic upgrade head

      - name: 发送部署通知
        uses: 8398a7/action-slack@v3
        with:
          status: success
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 验证部署
        run: |
          echo "等待服务启动..."
          sleep 60

          # 健康检查
          curl -f https://api.echomeet.cn/health || echo "健康检查失败"

          # 发送钉钉通知
          curl -X POST "${{ secrets.DINGTALK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"生产环境部署完成\n版本: ${GITHUB_SHA}\n时间: $(date)\"}}"