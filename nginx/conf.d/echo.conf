# ============================================================
# 回声（Echo Meet）Nginx 站点配置
# 功能：HTTPS配置 / 管理后台域名 / SSE流式代理 / WebSocket代理
# ============================================================

# --------------------------------------------------------
# HTTP 服务（重定向到 HTTPS）
# --------------------------------------------------------
server {
    listen 80;
    server_name api.echomeet.cn admin.echomeet.cn;

    # ACME 验证（Let's Encrypt SSL证书申请）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # 健康检查端点（不重定向）
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
        access_log off;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------
# HTTPS 服务（主域名 API）
# --------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name api.echomeet.cn;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/api.echomeet.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.echomeet.cn/privkey.pem;

    # SSL 协议和加密套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # SSL 会话配置
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS（强制 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP 配置
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://api.echomeet.cn wss://api.echomeet.cn; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # 客户端请求限制
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # ----------------------------------------------------
    # SSE 流式响应代理（AI 对话流式接口，需禁用缓冲）
    # 必须放在 /api/ 之前，确保优先匹配
    # ----------------------------------------------------
    location ~ ^/api/v1/ai/chat/stream {
        limit_req zone=sse burst=5 nodelay;
        limit_conn conn_limit 5;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;

        # SSE 关键配置：禁用缓冲，保持长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;

        # SSE 超时配置（AI 生成可能较慢）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # SSE 响应头
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    # ----------------------------------------------------
    # WebSocket 代理（好友私聊）
    # ----------------------------------------------------
    location /api/v1/ws/ {
        limit_req zone=websocket burst=20 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://api_backend/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket 长连接配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # 禁用缓冲
        proxy_buffering off;
    }

    # ----------------------------------------------------
    # 通用 API 代理
    # ----------------------------------------------------
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://api_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # ----------------------------------------------------
    # 静态资源（前端）
    # ----------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # 静态资源缓存优化
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# --------------------------------------------------------
# HTTPS 服务（管理后台域名）
# --------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name admin.echomeet.cn;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/admin.echomeet.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/admin.echomeet.cn/privkey.pem;

    # SSL 协议和加密套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # SSL 会话配置
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_ADMIN:10m;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 管理后台 CSP（更严格）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://admin.echomeet.cn;" always;

    # 管理后台访问控制（可选：IP 白名单）
    # allow 192.168.1.0/24;
    # deny all;

    # ----------------------------------------------------
    # 管理后台 API 代理（更严格的速率限制）
    # ----------------------------------------------------
    location /api/admin/v1/ {
        limit_req zone=admin burst=10 nodelay;
        limit_conn conn_limit 5;

        proxy_pass http://api_backend/api/admin/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # ----------------------------------------------------
    # 管理后台静态资源
    # ----------------------------------------------------
    location / {
        root /usr/share/nginx/admin;
        try_files $uri $uri/ /index.html;

        expires 1h;
        add_header Cache-Control "public";
    }

    # 静态资源缓存优化
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/admin;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}