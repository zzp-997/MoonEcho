# ============================================================
# 回声（Echo Meet）Nginx 配置
# 功能：API代理 / WebSocket代理 / SSE流式代理 / 管理后台 / 静态资源 / SSL / Gzip / 安全头
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # 基础配置
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 隐藏版本号
    server_tokens off;

    # 客户端请求限制
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # --------------------------------------------------------
    # 速率限制区域定义
    # --------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=websocket:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=sse:10m rate=10r/s;

    # 连接限制
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --------------------------------------------------------
    # Gzip 压缩配置
    # --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------
    # 上游服务器定义
    # --------------------------------------------------------
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # --------------------------------------------------------
    # HTTP 服务
    # --------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # 健康检查端点
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ACME 验证（Let's Encrypt）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其他请求重定向到 HTTPS（生产环境启用）
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # ----------------------------------------------------
        # SSE 流式响应代理（AI 对话流式接口，需禁用缓冲）
        # 必须放在 /api/ 之前，确保优先匹配
        # ----------------------------------------------------
        location ~ ^/api/v1/ai/chat/stream {
            limit_req zone=sse burst=5 nodelay;
            limit_conn conn_limit 5;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # SSE 关键配置：禁用缓冲，保持长连接
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;

            # SSE 超时配置（AI 生成可能较慢）
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # SSE 响应头
            add_header X-Accel-Buffering no;
            add_header Cache-Control no-cache;
        }

        # ----------------------------------------------------
        # 管理后台 API 代理（更严格的速率限制）
        # 路径 /api/admin/v1/ 需优先匹配
        # ----------------------------------------------------
        location /api/admin/v1/ {
            limit_req zone=admin burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://api_backend/api/admin/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }

        # ----------------------------------------------------
        # WebSocket 代理（好友私聊）
        # 实际路由路径为 /api/v1/ws/chat
        # ----------------------------------------------------
        location /api/v1/ws/ {
            limit_req zone=websocket burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://api_backend/api/v1/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 长连接配置
            proxy_connect_timeout 30s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;

            # 禁用缓冲
            proxy_buffering off;
        }

        # ----------------------------------------------------
        # 通用 API 代理
        # ----------------------------------------------------
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://api_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # CORS 交由 FastAPI CORSMiddleware 统一处理
            # 不在 Nginx 层添加 CORS 头，避免双重 CORS 头导致浏览器拒绝

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }

        # ----------------------------------------------------
        # 静态资源（前端）
        # ----------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            # 静态资源缓存
            expires 1d;
            add_header Cache-Control "public, immutable";

            # 安全头
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # 静态资源缓存优化
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

