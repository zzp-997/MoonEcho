# Alembic 配置文件

[alembic]
# 迁移脚本目录
script_location = alembic

# 版本文件命名模板
file_template = %%(year)d%%(month).02d%%(day).02d_%%(hour).02d%%(minute).02d_%%(rev)s_%%(slug)s

# 时区
timezone = Asia/Shanghai

# 是否截断长标识符
truncate_slug_length = 40

# 版本目录
version_path_separator = os

# 输出编码
output_encoding = utf-8

# 数据库 URL（由 env.py 动态设置，这里仅作为占位）
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
