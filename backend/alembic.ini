# Alembic Configuration

[alembic]
# migration scripts directory
script_location = alembic

# version file naming template
file_template = %%(year)d%%(month).02d%%(day).02d_%%(hour).02d%%(minute).02d_%%(rev)s_%%(slug)s

# timezone
timezone = Asia/Shanghai

# truncate long identifiers
truncate_slug_length = 40

# version path separator
version_path_separator = os

# output encoding
output_encoding = utf-8

# database URL (set dynamically by env.py)
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
