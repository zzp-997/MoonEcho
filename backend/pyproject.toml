[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-backend"
version = "0.1.0"
description = "Echo backend — 情绪急救APP后端服务"
requires-python = ">=3.11"
dependencies = [
  # Web 框架
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",

  # 数据库
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
  "asyncmy>=0.2.9,<1.0",
  "alembic>=1.13,<2.0",

  # 数据验证与配置
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "python-dotenv>=1.0,<2.0",

  # 认证与安全
  "python-jose[cryptography]>=3.3,<4.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "cryptography>=42.0,<44.0",

  # 缓存
  "redis>=5.0,<6.0",

  # HTTP 客户端（调用 AI/短信等外部 API）
  "httpx>=0.27,<1.0",

  # 异步文件操作
  "aiofiles>=23.0,<25.0",

  # 图片处理
  "Pillow>=10.3,<11.0",

  # 任务调度
  "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "httpx>=0.27,<1.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
