# ============================================================
# 回声（Echo Meet）Docker Compose 公测环境配置
# 包含：MySQL 8.0 + Redis 7 + API + Nginx + Uptime Kuma + MinIO
# ============================================================

version: '3.8'

services:
  # ----------------------------------------------------------
  # MySQL 8.0 - 主数据库
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: echo_meet_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-echo_root_2026}
      MYSQL_DATABASE: echo_meet
      MYSQL_USER: ${MYSQL_USER:-echo_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-echo_app_2026}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=200
      --innodb-buffer-pool-size=256M
      --slow-query-log=ON
      --long-query-time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-echo_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - echo_network

  # ----------------------------------------------------------
  # Redis 7 - 缓存 / 会话 / 消息队列
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: echo_meet_redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - echo_network

  # ----------------------------------------------------------
  # API - FastAPI 后端服务
  # ----------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echo_meet_api
    restart: always
    environment:
      # 环境标识（config.py 使用 APP_ENV 加载对应 .env 文件）
      - APP_ENV=${APP_ENV:-beta}
      - ENV=${ENV:-beta}
      - DEBUG=${DEBUG:-false}
      # 数据库
      - DATABASE_URL=mysql+asyncmy://${MYSQL_USER:-echo_app}:${MYSQL_PASSWORD:-echo_app_2026}@mysql:3306/echo_meet
      # Redis
      - REDIS_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-echo_jwt_dev_secret_2026}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # MinIO / 存储
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-echo-meet}
      # AI
      - AI_PROVIDER=${AI_PROVIDER:-glm_free}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-10}
      - AI_DAILY_LIMIT_VIP=${AI_DAILY_LIMIT_VIP:-100}
      # 短信
      - SMS_PROVIDER=${SMS_PROVIDER:-mock}
      # 内容审核（公测使用本地关键词过滤）
      - CONTENT_AUDIT_PROVIDER=${CONTENT_AUDIT_PROVIDER:-local}
      # 推送
      - PUSH_PROVIDER=${PUSH_PROVIDER:-jpush_free}
      - JPUSH_APP_KEY=${JPUSH_APP_KEY:-}
      - JPUSH_MASTER_SECRET=${JPUSH_MASTER_SECRET:-}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # 业务配置
      - MAX_FRIENDS_COUNT=${MAX_FRIENDS_COUNT:-500}
      - AI_FREE_QUOTA_DAILY=${AI_FREE_QUOTA_DAILY:-10}
      - POLISH_FREE_QUOTA_DAILY=${POLISH_FREE_QUOTA_DAILY:-3}
      - REPORT_FREE_QUOTA_WEEKLY=${REPORT_FREE_QUOTA_WEEKLY:-1}
      # 日志
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # 公测环境：移除 --reload，使用生产级启动命令
    # init.sql 已创建表结构，跳过 alembic 迁移直接启动 uvicorn
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-4}"
    volumes:
      - ./backend:/app
    networks:
      - echo_network

  # ----------------------------------------------------------
  # Nginx - 反向代理 / SSL / 静态资源
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: echo_meet_nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist/build/h5:/usr/share/nginx/html:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - echo_network

  # ----------------------------------------------------------
  # Uptime Kuma - 服务监控
  # ----------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: echo_meet_uptime_kuma
    restart: always
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - echo_network

  # ----------------------------------------------------------
  # MinIO - 对象存储（公测环境替代阿里云 OSS）
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: echo_meet_minio
    restart: always
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - echo_network

  # ----------------------------------------------------------
  # MinIO 初始化 - 自动创建存储桶
  # ----------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: echo_meet_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb myminio/echo-meet --ignore-existing &&
        mc anonymous set download myminio/echo-meet &&
        echo 'MinIO 存储桶初始化完成'
      "
    networks:
      - echo_network

# ----------------------------------------------------------
# 持久化数据卷
# ----------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  uptime_kuma_data:
    driver: local

# ----------------------------------------------------------
# 网络
# ----------------------------------------------------------
networks:
  echo_network:
    driver: bridge
