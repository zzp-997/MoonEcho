# ============================================================
# 回声（Echo Meet）Docker Compose 生产环境配置
# 包含：MySQL 8.0 + Redis 7 + API + Nginx + Uptime Kuma + MinIO
# 生产环境特有：资源限制、日志配置、安全加固、健康检查优化
# ============================================================

version: '3.8'

services:
  # ----------------------------------------------------------
  # MySQL 8.0 - 主数据库
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: echo_meet_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: echo_meet
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - mysql_backup:/backup
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=256M
      --slow-query-log=ON
      --long-query-time=2
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-expire-logs-seconds=604800
      --sync-binlog=1
      --innodb-flush-log-at-trx-commit=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    # 安全配置
    security_opt:
      - no-new-privileges:true
    networks:
      - echo_network
      - db_internal

  # ----------------------------------------------------------
  # Redis 7 - 缓存 / 会话 / 消息队列
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: echo_meet_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - echo_network

  # ----------------------------------------------------------
  # API - FastAPI 后端服务
  # ----------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - APP_ENV=production
    image: echo-meet-api:${API_VERSION:-latest}
    container_name: echo_meet_api
    restart: always
    environment:
      - APP_ENV=production
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/echo_meet
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-echo-meet}
      - AI_PROVIDER=${AI_PROVIDER:-zhipu}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-10}
      - AI_DAILY_LIMIT_VIP=${AI_DAILY_LIMIT_VIP:-100}
      - SMS_PROVIDER=${SMS_PROVIDER:-aliyun}
      - CONTENT_AUDIT_PROVIDER=${CONTENT_AUDIT_PROVIDER:-aliyun}
      - PUSH_PROVIDER=${PUSH_PROVIDER:-jpush}
      - JPUSH_APP_KEY=${JPUSH_APP_KEY}
      - JPUSH_MASTER_SECRET=${JPUSH_MASTER_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MAX_FRIENDS_COUNT=${MAX_FRIENDS_COUNT:-500}
      - AI_FREE_QUOTA_DAILY=${AI_FREE_QUOTA_DAILY:-10}
      - POLISH_FREE_QUOTA_DAILY=${POLISH_FREE_QUOTA_DAILY:-3}
      - REPORT_FREE_QUOTA_WEEKLY=${REPORT_FREE_QUOTA_WEEKLY:-1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ANON_MAPPING_ENCRYPTION_KEY=${ANON_MAPPING_ENCRYPTION_KEY}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-4} --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - ./backend/logs:/app/logs
      - api_tmp:/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      # 多实例部署支持
      replicas: 1
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    security_opt:
      - no-new-privileges:true
    # 只读文件系统（除必要目录）
    read_only: false
    networks:
      - echo_network

  # ----------------------------------------------------------
  # Nginx - 反向代理 / SSL / 静态资源
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: echo_meet_nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - echo_network

  # ----------------------------------------------------------
  # Uptime Kuma - 服务监控
  # ----------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: echo_meet_uptime_kuma
    restart: always
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - echo_network

  # ----------------------------------------------------------
  # MinIO - 对象存储
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: echo_meet_minio
    restart: always
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - echo_network

  # ----------------------------------------------------------
  # MinIO 初始化 - 自动创建存储桶
  # ----------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: echo_meet_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb myminio/echo-meet --ignore-existing &&
        mc anonymous set download myminio/echo-meet &&
        echo 'MinIO 存储桶初始化完成'
      "
    networks:
      - echo_network

  # ----------------------------------------------------------
  # 备份服务 - 定时数据备份
  # ----------------------------------------------------------
  backup:
    image: alpine:latest
    container_name: echo_meet_backup
    restart: always
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=echo_meet
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * 0}
      - OSS_ENDPOINT=${OSS_ENDPOINT}
      - OSS_BUCKET=${OSS_BUCKET}
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY}
    volumes:
      - mysql_backup:/backup/mysql
      - redis_backup:/backup/redis
      - ./scripts/backup.sh:/backup.sh:ro
    command: sh -c "crontab -l | { cat; echo '${BACKUP_SCHEDULE:-0 3 * * 0} /backup.sh'; } | crontab - && crond -f -l 2"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - echo_network

# ----------------------------------------------------------
# 持久化数据卷
# ----------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  mysql_backup:
    driver: local
  redis_data:
    driver: local
  redis_backup:
    driver: local
  minio_data:
    driver: local
  uptime_kuma_data:
    driver: local
  nginx_logs:
    driver: local
  nginx_cache:
    driver: local
  api_tmp:
    driver: local

# ----------------------------------------------------------
# 网络配置（隔离内部服务）
# ----------------------------------------------------------
networks:
  echo_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
  db_internal:
    driver: bridge
    internal: true
